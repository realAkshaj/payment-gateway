server:
  port: 8080    # The single public-facing port

spring:
  application:
    name: api-gateway

  # Redis for rate limiting
  data:
    redis:
      host: localhost
      port: 6379

  # Disable Spring MVC autoconfiguration
  # Gateway uses WebFlux — these conflict
  main:
    web-application-type: reactive

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

# JWT secret — in production load from Vault
jwt:
  secret: mySecretKeyForDevelopmentOnlyNotForProduction123

# Gateway request logging
logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.paymentgateway.gateway: DEBUG